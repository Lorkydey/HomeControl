[package]
name = "homecontrol"
version = "0.2.0"
description = "Un petit contrôleur de lumières Matter"
authors = ["Lorkydey"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Lorkydey/HomeControl"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
dunce = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
